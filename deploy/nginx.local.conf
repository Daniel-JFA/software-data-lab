# Configuración de nginx para el despliegue local (sirve dist/ y reenvía /api/ a la API).
# En producción usa el bloque equivalente del README (con tu server_name y HTTPS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Redirecciones relativas (/portafolio -> /portafolio/): evita URLs con el puerto interno detrás de Docker o de un proxy.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Archivos con hash: caché larga. add_header en un location reemplaza los del nivel superior, por eso se repiten.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

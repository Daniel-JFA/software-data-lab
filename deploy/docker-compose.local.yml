# Despliegue local completo: sitio estático (nginx) + API de formularios.
# Uso (desde la raíz del proyecto):
#   npm run build
#   docker compose -f deploy/docker-compose.local.yml up -d --build
#   -> http://localhost:8080
name: sdl-local

services:
  api:
    build: ../api
    env_file: ../api/.env
    restart: unless-stopped
    volumes:
      - sdl_local_data:/data

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ../propuestas:/srv/propuestas:ro
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sdl_local_data:
